[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icu-champion-challenger"
version = "0.1.0"
description = "Research MLOps prototype for ICU deterioration risk estimation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "mlflow>=2.10",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "evidently>=0.4"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=4", "httpx>=0.27", "ruff>=0.3", "mypy>=1.8"]
notebooks = ["jupyterlab>=4", "matplotlib>=3.8", "seaborn>=0.13"]
temporal = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
